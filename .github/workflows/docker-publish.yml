name: Docker Build & Publish

# ─────────────────────────────────────────────────────────────────────────────
# This job BUILDS + PUSHES the images only (web + worker; tags: latest,
# staging-latest, sha-<short>, <branch>). It does NOT auto-deploy any environment.
#
# NOTE (staging deploy is GATED — data-first, per ~/.claude/rules/staging-refresh-gate.md):
#   Staging is deployed ONLY via deploy/staging-refresh-and-deploy.sh so the
#   prod→staging data refresh always runs BEFORE the new image + migrations.
#   Keep the staging Komodo stack's auto_update OFF, or Komodo may pull the image
#   out of order.
#
#   DEMO      → manual promotion: deploy/compose/push-to-demo.sh (migrations YES, NEVER reseed).
#   PRODUCTION→ manual promotion: deploy/compose/push-to-prod.sh (explicit owner word only).
#   Production is NEVER auto-deployed.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/orqafy
  WORKER_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/orqafy-worker

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU (multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (web)
        id: meta-web
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging-latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push (web)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Extract metadata (worker)
        id: meta-worker
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.WORKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging-latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push (worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/worker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
