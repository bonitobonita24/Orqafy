name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  governance:
    name: Governance gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tools:validate-inputs
      - run: pnpm tools:check-env
      - run: pnpm tools:check-product-sync

  quality:
    name: "Turbo ${{ matrix.task }}"
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [lint, typecheck, test, build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orqafy_test
          POSTGRES_USER: orqafy
          POSTGRES_PASSWORD: orqafy_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orqafy -d orqafy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run db migrations (test task only)
        if: matrix.task == 'test'
        env:
          DATABASE_URL: postgresql://orqafy:orqafy_test_password@localhost:5432/orqafy_test?schema=public
        run: |
          pnpm --filter @orqafy/db exec prisma migrate deploy
          pnpm --filter @orqafy/db exec prisma generate
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-
      - run: pnpm turbo run ${{ matrix.task }} --cache-dir=.turbo
        env:
          DATABASE_URL: postgresql://orqafy:orqafy_test_password@localhost:5432/orqafy_test?schema=public
          REDIS_URL: redis://localhost:6379

  security:
    name: Dependency vulnerability audit
    needs: governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit for high and critical vulnerabilities
        run: pnpm audit --audit-level=high
