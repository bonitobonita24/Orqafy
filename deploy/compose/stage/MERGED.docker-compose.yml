# =============================================================
# ORQAFY STAGING — Komodo Stack compose (single-file merge)
# =============================================================
# Regenerated 2026-07-19 to match the LIVE stack at
# /etc/komodo/stacks/orqafy-staging/ (ground-truthed via read-only SSH) —
# see docs/DEPLOY_COMPOSE_RECONCILIATION.md for the full reconciliation record.
#
# Merges the 5 staging compose files actually deployed:
#   docker-compose.db.yml      (postgres only — NO pgbouncer)
#   docker-compose.cache.yml   (valkey)
#   docker-compose.storage.yml (minio)
#   docker-compose.worker.yml  (worker)
#   docker-compose.app.yml     (app, with Traefik labels)
# pgAdmin is NOT part of the deployed set (matches live).
#
# PASTE THIS ENTIRE FILE into:
#   Komodo UI → Stack orqafy-staging → Compose tab
#
# NOTES vs the individual files (same difference the individual files already carry):
#   1. env_file is co-located `.env` (Komodo writes the Stack Environment to
#      .env in the run directory, so the compose file references it as a
#      relative ".env" — not a path back to the repo root).
#   2. app_network declared ONCE as driver: bridge (instead of one creator
#      + N external references). proxy network still external: true since
#      Traefik creates it.
#   3. app/worker DATABASE_URL/DIRECT_URL/REDIS_URL are explicit overrides
#      pointing at INTERNAL_* env vars, so both always talk to the
#      co-located containers by Docker hostname regardless of what the
#      .env's public-facing values are.
#   4. Traefik router/service names are hardcoded to orqafy_staging_app
#      (not templated via COMPOSE_PROJECT_NAME) — this is the live,
#      working convention; matches the individual docker-compose.app.yml.
# =============================================================

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    driver: bridge
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
  valkey_data:
    name: ${COMPOSE_PROJECT_NAME}_valkey_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME}_minio_data

services:

  # ─── DATABASE ───
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    hostname: ${COMPOSE_PROJECT_NAME}_postgres
    env_file: .env
    environment:
      TZ: Asia/Manila
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port published — reachable internally as ${COMPOSE_PROJECT_NAME}_postgres:5432.
    # Avoids host-port collisions with sibling staging stacks (e.g. marine-guardian uses 5433).
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── CACHE ───
  valkey:
    image: valkey/valkey:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_valkey
    hostname: ${COMPOSE_PROJECT_NAME}_valkey
    env_file: .env
    environment:
      TZ: Asia/Manila
    command: valkey-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - valkey_data:/data
    # No host port published — reachable internally as ${COMPOSE_PROJECT_NAME}_valkey:6379.
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── STORAGE ───
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME}_minio
    hostname: ${COMPOSE_PROJECT_NAME}_minio
    env_file: .env
    environment:
      TZ: Asia/Manila
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # No host ports published — S3 API (9000) + console (9001) stay internal to app_network.
    # Inspect via `docker compose exec minio mc ...` or an SSH tunnel; never expose MinIO publicly.
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── BACKGROUND WORKER ───
  worker:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG:-staging-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    env_file: .env
    environment:
      TZ: Asia/Manila
      NODE_ENV: production
      STORAGE_BACKEND: telegram
      DATABASE_URL: ${INTERNAL_DATABASE_URL}
      DIRECT_URL: ${INTERNAL_DIRECT_URL}
      REDIS_URL: ${INTERNAL_REDIS_URL}
    networks: [app_network]
    restart: unless-stopped

  # ─── APP (Traefik-routed, no host port) ───
  app:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${APP_IMAGE_TAG:-staging-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_app
    hostname: ${COMPOSE_PROJECT_NAME}_app
    env_file: .env
    environment:
      TZ: Asia/Manila
      NODE_ENV: production
      PORT: "3000"
      AUTH_TRUST_HOST: "true"
      STORAGE_BACKEND: telegram
      DATABASE_URL: ${INTERNAL_DATABASE_URL}
      DIRECT_URL: ${INTERNAL_DIRECT_URL}
      REDIS_URL: ${INTERNAL_REDIS_URL}
    networks: [app_network, proxy]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.orqafy_staging_app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.orqafy_staging_app.entrypoints=websecure"
      - "traefik.http.routers.orqafy_staging_app.tls=true"
      - "traefik.http.routers.orqafy_staging_app.tls.certresolver=letsencrypt"
      - "traefik.http.services.orqafy_staging_app.loadbalancer.server.port=3000"
