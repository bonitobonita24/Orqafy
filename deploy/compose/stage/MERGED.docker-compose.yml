# =============================================================
# ORQAFY STAGING — Komodo Stack compose (single-file merge)
# =============================================================
# Generated 2026-06-03 by merging the 6 staging compose files:
#   docker-compose.db.yml      (postgres + pgbouncer)
#   docker-compose.cache.yml   (valkey)
#   docker-compose.storage.yml (minio)
#   docker-compose.pgadmin.yml (pgadmin)
#   docker-compose.worker.yml  (worker)
#   docker-compose.app.yml     (app, with Traefik labels)
#
# PASTE THIS ENTIRE FILE into:
#   Komodo UI → Stack orqafy-staging → Compose tab
#
# DIFFERENCES vs the individual files:
#   1. env_file paths changed from ../../../.env.staging → .env
#      (Komodo writes the Stack Environment to .env in the run directory,
#      so the compose file references it as a relative ".env")
#   2. app_network declared ONCE as driver: bridge (instead of one creator
#      + 5 external references). proxy network still external: true since
#      Traefik creates it.
#   3. pgAdmin's pgadmin-servers.json bind-mount REMOVED. If you want
#      pre-registered server connection, copy pgadmin-servers.json to
#      /opt/stacks/orqafy-staging/pgadmin-servers.json on the Komodo
#      server and add the volume mount back manually. Otherwise register
#      the postgres server in pgAdmin UI once after first deploy.
# =============================================================

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    driver: bridge
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
  pgbouncer_data:
    name: ${COMPOSE_PROJECT_NAME}_pgbouncer_data
  valkey_data:
    name: ${COMPOSE_PROJECT_NAME}_valkey_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME}_minio_data
  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME}_pgadmin_data

services:

  # ─── DATABASE ───
  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    hostname: ${COMPOSE_PROJECT_NAME}_postgres
    env_file: .env
    environment:
      TZ: Asia/Manila
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port published — reachable internally as ${COMPOSE_PROJECT_NAME}_postgres:5432.
    # Avoids host-port collisions with sibling staging stacks (e.g. marine-guardian uses 5433).
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: ${COMPOSE_PROJECT_NAME}_pgbouncer
    hostname: ${COMPOSE_PROJECT_NAME}_pgbouncer
    env_file: .env
    environment:
      TZ: Asia/Manila
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${COMPOSE_PROJECT_NAME}_postgres:5432/${DB_NAME}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    # No host port published — reachable internally as ${COMPOSE_PROJECT_NAME}_pgbouncer:5432.
    networks: [app_network]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ─── CACHE ───
  valkey:
    image: valkey/valkey:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_valkey
    hostname: ${COMPOSE_PROJECT_NAME}_valkey
    env_file: .env
    environment:
      TZ: Asia/Manila
    command: valkey-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - valkey_data:/data
    # No host port published — reachable internally as ${COMPOSE_PROJECT_NAME}_valkey:6379.
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── STORAGE ───
  minio:
    image: minio/minio:latest
    container_name: ${COMPOSE_PROJECT_NAME}_minio
    hostname: ${COMPOSE_PROJECT_NAME}_minio
    env_file: .env
    environment:
      TZ: Asia/Manila
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # No host ports published — S3 API (9000) + console (9001) stay internal to app_network.
    # Inspect via `docker compose exec minio mc ...` or an SSH tunnel; never expose MinIO publicly.
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── DB MANAGEMENT UI ───
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME}_pgadmin
    hostname: ${COMPOSE_PROJECT_NAME}_pgadmin
    env_file: .env
    environment:
      TZ: Asia/Manila
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # pgadmin-servers.json bind-mount removed — register postgres server
      # manually in pgAdmin UI after first deploy. See header comment.
    # No host port published — reach pgAdmin via an SSH tunnel to ${COMPOSE_PROJECT_NAME}_pgadmin:80.
    networks: [app_network]
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── BACKGROUND WORKER ───
  worker:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG:-staging-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    env_file: .env
    environment:
      - TZ=Asia/Manila
      - NODE_ENV=production
      - WORKER_PORT=${WORKER_PORT}
    networks: [app_network]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WORKER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── APP (Traefik-routed, no host port) ───
  app:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${APP_IMAGE_TAG:-staging-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_app
    hostname: ${COMPOSE_PROJECT_NAME}_app
    env_file: .env
    environment:
      - TZ=Asia/Manila
      - NODE_ENV=production
      - PORT=${APP_PORT}
    networks: [app_network, proxy]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${APP_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}_app.loadbalancer.server.port=3000"
