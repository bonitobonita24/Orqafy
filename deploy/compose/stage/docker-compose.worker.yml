networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  worker:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG:-staging-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
      NODE_ENV: production
      # Persistent media default = Telegram on dev+staging+prod (media-storage-default.md).
      # TELEGRAM_* real values come from Server-Setups (SOPS+age) via the stack .env — never hardcode.
      STORAGE_BACKEND: telegram
      # Internal DB/cache URLs override whatever the .env's public-facing values are,
      # so the worker always talks to the co-located containers by Docker hostname.
      DATABASE_URL: ${INTERNAL_DATABASE_URL}
      DIRECT_URL: ${INTERNAL_DIRECT_URL}
      REDIS_URL: ${INTERNAL_REDIS_URL}
    networks: [app_network]
    restart: unless-stopped
