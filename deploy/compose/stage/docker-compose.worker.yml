networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  worker:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG:-staging-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    env_file: ../../../.env.staging
    environment:
      - TZ=Asia/Manila
      - NODE_ENV=production
      - WORKER_PORT=${WORKER_PORT}
    networks: [app_network]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WORKER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
