networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

volumes:
  valkey_data:
    name: ${COMPOSE_PROJECT_NAME}_valkey_data

services:
  valkey:
    image: valkey/valkey:7-alpine
    mem_limit: 128m
    memswap_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    container_name: ${COMPOSE_PROJECT_NAME}_valkey
    hostname: ${COMPOSE_PROJECT_NAME}_valkey
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
    command: valkey-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - valkey_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
