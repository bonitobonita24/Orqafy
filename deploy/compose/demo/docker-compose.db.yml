networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    driver: bridge

# NOTE: pgbouncer is intentionally NOT deployed on this stack (matches live —
# the app/worker connect directly to postgres via INTERNAL_DATABASE_URL).
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data

services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    hostname: ${COMPOSE_PROJECT_NAME}_postgres
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
