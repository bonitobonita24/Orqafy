networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

services:
  app:
    # NO build: key — image pulled from Docker Hub only (demo is a deliberate-push env)
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${APP_IMAGE_TAG:-demo-latest}
    container_name: ${COMPOSE_PROJECT_NAME}_app
    hostname: ${COMPOSE_PROJECT_NAME}_app
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
      NODE_ENV: production
      PORT: "3000"
      AUTH_TRUST_HOST: "true"
      # Demo is the ONE env that stays on MinIO/S3 object storage (media-storage-default.md).
      STORAGE_BACKEND: s3
      # Internal DB/cache URLs override whatever the .env's public-facing values are,
      # so the app always talks to the co-located containers by Docker hostname.
      DATABASE_URL: ${INTERNAL_DATABASE_URL}
      DIRECT_URL: ${INTERNAL_DIRECT_URL}
      REDIS_URL: ${INTERNAL_REDIS_URL}
    networks: [app_network, proxy]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.orqafy_demo_app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.orqafy_demo_app.entrypoints=websecure"
      - "traefik.http.routers.orqafy_demo_app.tls=true"
      - "traefik.http.routers.orqafy_demo_app.tls.certresolver=letsencrypt"
      - "traefik.http.services.orqafy_demo_app.loadbalancer.server.port=3000"
