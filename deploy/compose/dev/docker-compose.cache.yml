networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

volumes:
  valkey_data:
    name: orqafy_dev_valkey_data  # ORQ-49: pinned to the pre-rename volume (old project orqafy_dev) so dev data survives the orqafy_saas_dev rename

services:
  valkey:
    image: valkey/valkey:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_valkey
    hostname: ${COMPOSE_PROJECT_NAME}_valkey
    env_file: ../../../.env.dev
    environment:
      TZ: Asia/Manila
    command: valkey-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - valkey_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks: [app_network]
    restart: "no"
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
