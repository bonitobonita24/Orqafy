# =============================================================
# ORQAFY PRODUCTION — Komodo Stack compose (single-file merge)
# =============================================================
# Regenerated 2026-08-31 (ORQ-13) by merging the current prod compose files:
#   docker-compose.db.yml      (postgres + pgbouncer)
#   docker-compose.cache.yml   (valkey)
#   docker-compose.storage.yml (minio)
#   docker-compose.pgadmin.yml (pgadmin)
#   docker-compose.worker.yml  (worker)
#   docker-compose.app.yml     (app, with Traefik labels)
#
# STORAGE: persistent media lives on Telegram (STORAGE_BACKEND=telegram, set on
# app + worker per media-storage-default.md). MinIO is retained as the local
# temp/index/scratch fallback — it MUST stay in this stack, do not drop it.
# (The old "No MinIO — uses R2" note was stale; live prod runs MinIO.)
#
# PASTE THIS ENTIRE FILE into:
#   Komodo UI → Stack orqafy-prod → Compose tab
#
# PASTE .env.prod into:
#   Komodo UI → Stack orqafy-prod → Environment tab
#
# Port allocations (non-conflicting with other stacks on this host):
#   DB_PORT=5435        (yelli=5432, mg-staging=5433, mg-prod=5434)
#   PGBOUNCER_PORT=6435 (yelli=6432, mg-staging=6433, mg-prod=6434)
#   REDIS_PORT=6382     (yelli=6379, mg-staging=6380, mg-prod=6381)
# =============================================================

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    driver: bridge
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
  pgbouncer_data:
    name: ${COMPOSE_PROJECT_NAME}_pgbouncer_data
  valkey_data:
    name: ${COMPOSE_PROJECT_NAME}_valkey_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME}_minio_data
  pgadmin_data:
    name: ${COMPOSE_PROJECT_NAME}_pgadmin_data

services:

  # ─── DATABASE ───
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    hostname: ${COMPOSE_PROJECT_NAME}_postgres
    env_file: .env
    environment:
      TZ: Asia/Manila
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    mem_limit: 128m
    memswap_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    container_name: ${COMPOSE_PROJECT_NAME}_pgbouncer
    hostname: ${COMPOSE_PROJECT_NAME}_pgbouncer
    env_file: .env
    environment:
      TZ: Asia/Manila
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@${COMPOSE_PROJECT_NAME}_postgres:5432/${DB_NAME}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: scram-sha-256
    ports:
      - "${PGBOUNCER_PORT}:5432"
    networks: [app_network]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ─── CACHE ───
  valkey:
    image: valkey/valkey:7-alpine
    mem_limit: 128m
    memswap_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    container_name: ${COMPOSE_PROJECT_NAME}_valkey
    hostname: ${COMPOSE_PROJECT_NAME}_valkey
    env_file: .env
    environment:
      TZ: Asia/Manila
    command: valkey-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - valkey_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── STORAGE (MinIO — temp/index/scratch fallback; persistent media on Telegram) ───
  minio:
    image: minio/minio:latest
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    container_name: ${COMPOSE_PROJECT_NAME}_minio
    hostname: ${COMPOSE_PROJECT_NAME}_minio
    env_file: .env
    environment:
      TZ: Asia/Manila
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${STORAGE_PORT}:9000"
      - "${STORAGE_CONSOLE_PORT}:9001"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── DB MANAGEMENT UI ───
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${COMPOSE_PROJECT_NAME}_pgadmin
    hostname: ${COMPOSE_PROJECT_NAME}_pgadmin
    env_file: .env
    environment:
      TZ: Asia/Manila
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    # No host port — reach via SSH tunnel to ${COMPOSE_PROJECT_NAME}_pgadmin:80
    networks: [app_network]
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── BACKGROUND WORKER ───
  worker:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG:-latest}
    mem_limit: 384m
    memswap_limit: 384m
    mem_reservation: 128m
    cpus: 0.5
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    env_file: .env
    environment:
      - TZ=Asia/Manila
      - NODE_ENV=production
      - WORKER_PORT=${WORKER_PORT}
      # Persistent media default = Telegram (media-storage-default.md).
      # TELEGRAM_* real values come from .env (Server-Setups SOPS+age) — never hardcode.
      - STORAGE_BACKEND=telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DEFAULT_CHANNEL_ID=${TELEGRAM_DEFAULT_CHANNEL_ID}
    networks: [app_network]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WORKER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── APP (Traefik-routed, no host port) ───
  app:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${APP_IMAGE_TAG:-latest}
    mem_limit: 768m
    memswap_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    container_name: ${COMPOSE_PROJECT_NAME}_app
    hostname: ${COMPOSE_PROJECT_NAME}_app
    env_file: .env
    environment:
      - TZ=Asia/Manila
      - NODE_ENV=production
      - PORT=${APP_PORT}
      # Persistent media default = Telegram (media-storage-default.md).
      # TELEGRAM_* real values come from .env (Server-Setups SOPS+age) — never hardcode.
      - STORAGE_BACKEND=telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DEFAULT_CHANNEL_ID=${TELEGRAM_DEFAULT_CHANNEL_ID}
    networks: [app_network, proxy]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${APP_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.tls=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}_app.tls.certresolver=letsencrypt"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}_app.loadbalancer.server.port=3000"
