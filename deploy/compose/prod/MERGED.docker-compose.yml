# =============================================================
# ORQAFY PRODUCTION — Komodo Stack compose (single-file merge)
# =============================================================
# Regenerated 2026-09-27 (ORQ-44) to match the LIVE stack on EC2-Komodo at
# /etc/komodo/stacks/orqafy-prod/ (ground-truthed via read-only SSH, compose
# files only — never .env). Prod moved Hostinger → EC2 in ORQ-43 (2026-09-17).
#
# Merges the 5 prod compose files actually deployed:
#   docker-compose.db.yml      (postgres only — NO pgbouncer)
#   docker-compose.cache.yml   (valkey, --maxmemory 200mb noeviction)
#   docker-compose.storage.yml (minio)
#   docker-compose.worker.yml  (worker)
#   docker-compose.app.yml     (app + www→apex redirect, Traefik labels)
# pgAdmin is NOT part of the deployed set (docker-compose.pgadmin.yml is repo-only).
#
# STORAGE: persistent media lives on Telegram (STORAGE_BACKEND=telegram, set on
# app + worker per media-storage-default.md). MinIO is retained as the local
# temp/index/scratch fallback — it MUST stay in this stack, do not drop it.
#
# PASTE THIS ENTIRE FILE into:
#   Komodo UI → Stack orqafy-prod → Compose tab
#
# Deliberate differences vs the live host files (ORQ-44, documented):
#   1. mem_limit/memswap_limit/mem_reservation/cpus kept (framework V32.10
#      mandatory compose resource limits); the host files carry none.
#   2. image fallback tag `:-latest` (host says `:-staging-latest`); the stack
#      .env pins APP_IMAGE_TAG=latest, so the fallback never fires.
#   3. app_network declared ONCE as driver: bridge (single-file form).
#   4. Traefik router/service names hardcoded orqafy_prod_* (live convention);
#      TLS via the `cloudflare` certresolver (DNS challenge).
# =============================================================

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    driver: bridge
  proxy:
    name: ${TRAEFIK_NETWORK:-proxy}
    external: true

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_data
  valkey_data:
    name: ${COMPOSE_PROJECT_NAME}_valkey_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME}_minio_data

services:

  # ─── DATABASE ───
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    memswap_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    container_name: ${COMPOSE_PROJECT_NAME}_postgres
    hostname: ${COMPOSE_PROJECT_NAME}_postgres
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── CACHE ───
  valkey:
    image: valkey/valkey:7-alpine
    mem_limit: 128m
    memswap_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    container_name: ${COMPOSE_PROJECT_NAME}_valkey
    hostname: ${COMPOSE_PROJECT_NAME}_valkey
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
    command: valkey-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction
    volumes:
      - valkey_data:/data
    ports:
      - "${REDIS_PORT}:6379"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── STORAGE ───
  minio:
    image: minio/minio:latest
    mem_limit: 256m
    memswap_limit: 256m
    mem_reservation: 64m
    cpus: 0.25
    container_name: ${COMPOSE_PROJECT_NAME}_minio
    hostname: ${COMPOSE_PROJECT_NAME}_minio
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${STORAGE_PORT}:9000"
      - "${STORAGE_CONSOLE_PORT}:9001"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── BACKGROUND WORKER ───
  worker:
    # NO build: key — image pulled from Docker Hub only.
    # Fallback `latest` (prod channel) kept deliberately; live host says `:-staging-latest` but the
    # stack .env pins APP_IMAGE_TAG=latest, so the fallback never fires (ORQ-44).
    image: ${DOCKERHUB_USERNAME}/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG:-latest}
    mem_limit: 384m
    memswap_limit: 384m
    mem_reservation: 128m
    cpus: 0.5
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
      NODE_ENV: production
      # Persistent media default = Telegram on dev+staging+prod (media-storage-default.md).
      # TELEGRAM_* real values come from Server-Setups (SOPS+age) via the stack .env — never hardcode.
      STORAGE_BACKEND: telegram
      # Internal DB/cache URLs override whatever the .env's public-facing values are,
      # so the worker always talks to the co-located containers by Docker hostname.
      DATABASE_URL: ${INTERNAL_DATABASE_URL}
      DIRECT_URL: ${INTERNAL_DIRECT_URL}
      REDIS_URL: ${INTERNAL_REDIS_URL}
    networks: [app_network]
    restart: unless-stopped

  # ─── APP (Traefik-routed, no host port) ───
  app:
    # NO build: key — image pulled from Docker Hub only.
    # Fallback tag is `latest` (the prod channel). Live host file says `:-staging-latest`, but the
    # stack .env always pins APP_IMAGE_TAG=latest (push-to-prod.sh), so the fallback never fires —
    # repo keeps the prod-correct fallback deliberately (ORQ-44).
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:${APP_IMAGE_TAG:-latest}
    mem_limit: 768m
    memswap_limit: 768m
    mem_reservation: 256m
    cpus: 1.0
    container_name: ${COMPOSE_PROJECT_NAME}_app
    hostname: ${COMPOSE_PROJECT_NAME}_app
    # env_file is co-located in the stack run directory (Komodo writes the Stack
    # Environment to .env there) — NOT a relative path back to the repo root.
    env_file: .env
    environment:
      TZ: Asia/Manila
      NODE_ENV: production
      PORT: "3000"
      AUTH_TRUST_HOST: "true"
      # Persistent media default = Telegram on dev+staging+prod (media-storage-default.md).
      # TELEGRAM_* real values come from Server-Setups (SOPS+age) via the stack .env — never hardcode.
      STORAGE_BACKEND: telegram
      # Internal DB/cache URLs override whatever the .env's public-facing values are,
      # so the app always talks to the co-located containers by Docker hostname.
      DATABASE_URL: ${INTERNAL_DATABASE_URL}
      DIRECT_URL: ${INTERNAL_DIRECT_URL}
      REDIS_URL: ${INTERNAL_REDIS_URL}
    networks: [app_network, proxy]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.orqafy_prod_app.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.orqafy_prod_app.entrypoints=websecure"
      - "traefik.http.routers.orqafy_prod_app.tls=true"
      - "traefik.http.routers.orqafy_prod_app.tls.certresolver=cloudflare"
      - "traefik.http.services.orqafy_prod_app.loadbalancer.server.port=3000"
      # www.orqafy.com → 301 to the apex (same service, redirectregex middleware).
      - "traefik.http.routers.orqafy_prod_www.rule=Host(`www.orqafy.com`)"
      - "traefik.http.routers.orqafy_prod_www.entrypoints=websecure"
      - "traefik.http.routers.orqafy_prod_www.tls=true"
      - "traefik.http.routers.orqafy_prod_www.tls.certresolver=cloudflare"
      - "traefik.http.routers.orqafy_prod_www.service=orqafy_prod_app"
      - "traefik.http.routers.orqafy_prod_www.middlewares=orqafy_prod_wwwredir"
      - "traefik.http.middlewares.orqafy_prod_wwwredir.redirectregex.regex=^https://www.orqafy.com/(.*)"
      - "traefik.http.middlewares.orqafy_prod_wwwredir.redirectregex.replacement=https://orqafy.com/$$1"
      - "traefik.http.middlewares.orqafy_prod_wwwredir.redirectregex.permanent=true"
