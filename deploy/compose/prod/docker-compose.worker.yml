networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  worker:
    # NO build: key — image pulled from Docker Hub only
    image: ${DOCKERHUB_USERNAME}/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG:-latest}
    mem_limit: 384m
    memswap_limit: 384m
    mem_reservation: 128m
    cpus: 0.5
    container_name: ${COMPOSE_PROJECT_NAME}_worker
    hostname: ${COMPOSE_PROJECT_NAME}_worker
    env_file: ../../../.env.prod
    environment:
      - TZ=Asia/Manila
      - NODE_ENV=production
      - WORKER_PORT=${WORKER_PORT}
      # Persistent media default = Telegram on dev+staging+prod (media-storage-default.md).
      # TELEGRAM_* real values come from Server-Setups (SOPS+age) via .env.prod at deploy time — never hardcode.
      - STORAGE_BACKEND=telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_DEFAULT_CHANNEL_ID=${TELEGRAM_DEFAULT_CHANNEL_ID}
    networks: [app_network]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${WORKER_PORT}/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
