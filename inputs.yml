  jwt_persistence: persistent

storage:
  enabled: true
  provider_dev: minio
  provider_prod: cloudflare-r2
  s3_compatible: true
  buckets:
    dev: orqafy-dev
    staging: orqafy-staging
    prod: orqafy-prod
  max_file_size_mb_default: 10
  max_file_size_mb_project_notes: 50
  max_file_size_mb_signature: 1
  allowed_mime_types_default:
    - image/jpeg
    - image/png
    - image/webp
    - application/pdf
  allowed_mime_types_project_notes:
    - image/jpeg
    - image/png
    - image/webp
    - application/pdf
    - text/plain
    - text/csv
    - text/markdown
  blocked_mime_types:
    - image/svg+xml   # XSS vector
    - text/html       # XSS vector
