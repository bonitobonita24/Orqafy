version: 3
generated_by: phase-3
generated_at: "2026-05-02"
agent: CLAUDE_CODE

app:
  name: Orqafy
  slug: orqafy
  tagline: "Move as one."
  industry: "ERP / SaaS / IT Services"
  parent_brand: "Powerbyte I.T. Solutions"

apps:
  - name: web
    framework: next
    type: web
    port_offset: 10
  - name: worker
    framework: node
    type: worker
    port_offset: 11
  - name: mobile
    framework: expo
    type: mobile
    distribution: enterprise

packages:
  - shared
  - api-client
  - db
  - ui
  - jobs
  - storage

tech_stack:
  frontend: next
  api_style: trpc
  orm: prisma
  auth_provider: authjs
  auth_strategy: authjs
  database: postgres
  cache: valkey
  queue: bullmq
  storage_dev: minio
  storage_prod: cloudflare-r2
  email_dev: mailhog
  email_prod: nodemailer
  ui_library: shadcn
  charts: shadcn-recharts
  data_tables: shadcn-tanstack
  maps_web: leaflet
  maps_mobile: react-native-maps
  rich_text: blocknote
  icons: lucide-react
  mobile_framework: expo
  mobile_ui: react-native-reusables
  mobile_local_db: watermelondb
  mobile_push: expo-push
  bot_protection: turnstile
  payment_gateway: xendit
  pdf: react-pdf
  exports: ["csv", "xlsx", "pdf"]
  realtime_web: sse
  realtime_mobile: trpc-react-query-polling
  reverse_proxy_prod: traefik
  signature_web: react-signature-canvas
  signature_mobile: react-native-signature-canvas
  scanning_mobile: expo-camera
  scanning_web: html5-qrcode

tenancy:
  mode: multi
  routing: subdirectory
  schema_isolation: per-tenant
  schema_naming: "t_<slug_underscored>"
  reserved_slugs: ["demo", "powerbyte-admin", "admin", "api", "static", "assets"]
  slug_pattern: "^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$"
  shared_global_data: true
  rls: false  # schema isolation replaces RLS — schema IS the boundary
  notes: |
    Separate PostgreSQL schema per tenant for ALL ERP data — locked.
    Justified by payroll, banking, GPS sensitivity. No tenantId column on
    ERP entities — schema_search_path is the boundary.

security:
  layers:
    L1_app_scoping: true       # via search_path per request
    L2_db_isolation: true       # schema-per-tenant (replaces RLS)
    L3_rbac: true               # always active
    L4_pool_limits: true        # PgBouncer
    L5_audit_log: true          # AuditLog per tenant + TenantAuditLog (global)
    L6_query_guardrails: true   # Prisma extension
  rate_limiting:
    public: { window_seconds: 60, max_requests: 10 }
    auth: { window_seconds: 60, max_requests: 10 }
    api: { window_seconds: 60, max_requests: 120 }
    upload: { window_seconds: 60, max_requests: 20 }
    mobile_sync: { window_seconds: 60, max_requests: 60 }
    public_invoice: { window_seconds: 60, max_requests: 30 }
    invoice_signature: { window_seconds: 60, max_requests: 5 }
    demo_login: { window_seconds: 60, max_requests: 30 }
    demo_role_switch: { window_seconds: 60, max_requests: 60 }
  csrf: same-site-lax
  encryption_at_rest: true
  password_hashing: bcrypt
  session_invalidation_on_role_change: true
  ssrf_prevention: true
  http_security_headers: true
  dompurify_sanitizer: true
  pnpm_audit_level: high

bot_protection:
  enabled: true
  provider: turnstile
  mode: managed
  protected_pages:
    - /login
    - /register
    - /forgot-password
    - /demo
    - /invoice/*/sign
  widget_count: 1
  prod_hostnames: 1  # only orqafy.powerbyte.app
  dev_uses_test_keys: true
  staging_uses_test_keys: true

payment:
  gateway: xendit
  scopes:
    platform:
      enabled: true        # Powerbyte's own Xendit account for tenant subscription billing
      keys_in_env: true    # XENDIT_SECRET_KEY etc. in platform .env
    tenant:
      enabled: true        # per-tenant Xendit for e-commerce + portal invoice payments
      v1_required: false   # deferred to v2 — TenantXenditConfig entity scaffolded
      keys_encrypted_at_rest: true
  methods: ["card", "gcash", "maya", "bank_transfer", "otc_711_cebuana"]
  recurring_subscriptions: true
  refunds: ["full", "partial"]
  currency_default: PHP
  currency_per_tenant_configurable: true
  webhook_endpoint: /api/webhooks/xendit
  webhook_verify: x-callback-token

tax:
  configurable_per_tenant: true
  fiscal_year_configurable: true
  default_currency: PHP
  default_vat_rate: 12

deploy:
  k8s:
    enabled: false
  compose:
    enabled: true
    monorepo_layout: deploy/compose/{env}/
    environments: ["dev", "stage", "prod"]
    mono_server: true
  domains:
    prod: orqafy.powerbyte.app
    staging: orqafy-staging.powerbyte.app
  manager:
    type: komodo
    staging_auto_update: true
    prod_auto_update: false
  reverse_proxy:
    type: traefik
    network: proxy
    cert_resolver: letsEncrypt

docker:
  publish: true
  registry: docker.io
  hub_repo: bonitobonita24/orqafy
  image_name: orqafy
  platforms:
    - linux/amd64
    - linux/arm64
  build_on_push_to: main
  dev_build: true
  tags_pushed_by_ci:
    - latest
    - staging-latest
    - "sha-<short>"

context7:
  enabled: true
  priority_libraries:
    - next.js
    - prisma
    - next-auth
    - trpc
    - shadcn-ui
    - bullmq
    - expo
    - watermelondb
    - valkey

accessibility:
  level: wcag_aa
  enforce_in_phase_2_6: true
  enforce_pre_delivery_checklist: true

design:
