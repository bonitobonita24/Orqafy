    body: Inter
    mono: SFMono-Regular
  notes: |
    DESIGN.md is authoritative. design-system/MASTER.md supplemental
    (component patterns, Vercel guidelines, WCAG AA enforcement,
    density/layout rules). Phase 4 reads both.

mobile:
